# Right half (peripheral) only. Driven by mctechnology17/zmk-nice-oled via the
# "modules" workflow input; see .github/workflows/build-chocofi.yml
#
# The peripheral keeps its display: right-hand keys were confirmed responsive
# over USB, so the peripheral->central link was never implicated. Only the
# central's display affected typing latency.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Astronaut. CAT is "default y" in the module's Kconfig.defconfig and
# widgets/animation.c selects with "#if HEAD / #elif CAT / #elif SPACEMAN",
# so CAT must be turned off explicitly or the spaceman never shows.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
