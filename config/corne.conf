# Chocofi (Corne shield), nice!nano v2.
#
# Intentionally empty of display settings. The two halves are built with
# different shields, so anything NICE_OLED_* must live in corne_right.conf --
# it is the only side that includes the display module, and Zephyr aborts the
# build on assignments to undefined symbols.
#
# The LEFT half is built with no display at all. This was measured, not
# assumed: with a display on the central, Bluetooth typing is noticeably
# laggy while USB is flawless. BLE can only transmit during a connection
# event every 7.5-15ms (ZMK's BT_PERIPHERAL_PREF_MIN_INT=6 / MAX_INT=12);
# the display subsystem's periodic work -- LVGL's timer handler, ZMK's
# display work queue, the Sharp LS0xx refresh -- competes for CPU and causes
# missed events, each costing a whole interval.
#
# Disabling just the typing-driven widgets (WPM, bongo cat) was NOT enough:
# it stayed laggy. The cost is the display's presence, not its content. Only
# removing the display from the central restored full responsiveness.
#
# USB is unaffected throughout, because it has no transmit window: the host
# polls and the firmware answers from a buffer.
