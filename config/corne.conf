# Chocofi (Corne shield) with nice!view, driven by mctechnology17/zmk-nice-oled.
# The module is supplied to the build via the "modules" workflow input; see
# .github/workflows/build-chocofi.yml

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Right half (peripheral): astronaut animation.
# CAT is "default y" in the module's Kconfig.defconfig and widgets/animation.c
# selects with "#if HEAD / #elif CAT / #elif SPACEMAN", so CAT wins whenever it
# is left on. It must be turned off explicitly or the spaceman never shows.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y

# Left half (central): static status only -- large BT profile indicator, layer
# name, own battery. No animation, nothing driven by typing.
#
# WPM is off deliberately. It is "default y" and BONGO_CAT sits inside
# "if NICE_OLED_WIDGET_WPM", so this one line removes the cat, WPM tracking and
# the ZMK_WPM timer together. It matters because WPM changes on EVERY keystroke,
# and each change triggers an LVGL redraw plus a full 160x68 SPI push -- exactly
# when that keystroke needs to reach the BLE radio. BLE can only transmit during
# a connection event every 7.5-15ms; miss one and the keypress waits for the
# next. That was measured, not guessed: a no-display control build removed the
# Bluetooth typing lag entirely, while USB was always fine because it has no
# such transmit window.
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=y
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Do NOT enable CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_*.
# Those options are unfinished upstream: the module's CMakeLists.txt drops
# widgets/battery.c when any of them is set, and the replacement widgets in
# that branch are still commented-out TODOs, so the result is no battery
# indicator at all rather than two.
