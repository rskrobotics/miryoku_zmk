# Chocofi (Corne shield), nice!nano v2.
#
# Intentionally empty of display settings. The two halves are built with
# different shields, so anything NICE_OLED_* must live in corne_right.conf --
# it is the only side that includes the display module, and Zephyr aborts the
# build on assignments to undefined symbols.
#
# The LEFT half uses ZMK's STOCK nice_view shield, not zmk-nice-oled. This
# was measured, not assumed. With zmk-nice-oled on the central half,
# Bluetooth typing was noticeably laggy while USB stayed flawless:
#
#   zmk-nice-oled + bongo cat        -> laggy
#   zmk-nice-oled, WPM and cat off   -> still laggy
#   no display at all                -> fast
#   stock nice_view                  -> fast, and keeps a status screen
#
# So it is not "displays cost latency" and not the typing-driven widgets --
# it is that module specifically, on the central half. BLE can only transmit
# during a connection event every 7.5-15ms (ZMK's BT_PERIPHERAL_PREF_MIN_INT=6
# / MAX_INT=12), and each missed event costs a whole interval. USB has no
# such window, which is why it was never affected.
#
# zmk-nice-oled remains on the PERIPHERAL, where it causes no problem.
# Before putting it back on the central, re-measure.
