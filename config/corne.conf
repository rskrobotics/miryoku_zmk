# Chocofi (Corne shield), nice!nano v2.
#
# Intentionally empty of display settings. The two halves are built with
# different shields, so anything NICE_OLED_* must live in corne_right.conf --
# it is the only side that includes the display module, and Zephyr aborts the
# build on assignments to undefined symbols.
#
# Per-side settings live in corne_left.conf and corne_right.conf. Both halves
# use zmk-nice-oled, but the central half needs specific display tuning to
# avoid Bluetooth typing lag -- see the measurement in corne_left.conf.
