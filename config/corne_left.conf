# Left half (central). Uses zmk-nice-oled, like the right half.
#
# The two settings at the bottom are load-bearing. Without them, zmk-nice-oled
# on the central half makes Bluetooth typing noticeably laggy while USB stays
# flawless. Measured across five builds:
#
#   module, default tuning, bongo cat      -> laggy
#   module, default tuning, WPM + cat off  -> still laggy
#   no display at all                      -> fast
#   stock nice_view                        -> fast
#   module, WPM + cat off, tuned below     -> fast
#   module, bongo cat ON, tuned below      -> fast
#
# So it was never "displays cost latency" and never the typing-driven widgets.
# It is the module's resource profile on the central half. BLE can only
# transmit during a connection event every 7.5-15ms (ZMK's
# BT_PERIPHERAL_PREF_MIN_INT=6 / MAX_INT=12) and each missed event costs a
# whole interval; USB has no such window, which is why it was never affected.
#
# If you change either setting, re-test on Bluetooth, not USB.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Layer name, large BT profile, SIG/BAT battery, and the WPM bongo cat.
#
# The cat is fine here. It was blamed first -- it redraws on every keystroke --
# but disabling it changed nothing while the tuning was still at defaults, and
# re-enabling it with the tuning in place costs nothing measurable.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=y
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Load-bearing. Module defaults are priority 5 and an 8192 pool; stock
# nice_view uses 4096 and ZMK's default priority. The module's own
# docs/OPTIMIZE.md describes priority 10 as "typing prioritized over display".
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# Upstream module, not our fork. The two tuning lines above are plain
# Zephyr/LVGL Kconfig symbols and work with any module -- the fork was never
# needed for the latency fix. Its only real content was the draw_background
# full-buffer clear (which did not fix the speck) and the brand text (off).
#
# LV_Z_FULL_REFRESH was removed: it changed nothing and cost a full 160x68
# SPI push on every redraw.

# The "speck": a modifier indicator clipped off the edge of the canvas.
#
# NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED is "default y" upstream, with
# layout BOX (2x2), style SYMBOL (14x14 icons, 2px spacing), at
# MODIFIERS_CUSTOM_X=62 / _Y=62. A 2x2 grid of 14px icons needs 30px of width,
# but the canvas drawing area is only 68 wide, so 24 of those 30 pixels fall
# off the edge:
#
#   Control   x 62-76, y 62-76  -> only x 62-67 visible
#   Shift     x 78-92, y 62-76  -> entirely off-canvas
#   Alt/Opt   x 62-76, y 78-92  -> only x 62-67 visible
#   Cmd/Gui   x 78-92, y 78-92  -> entirely off-canvas
#
# What was left was a 6px sliver of the Control and Alt icons -- which is why
# it lit up only for those two modifiers. Turned off; nothing else uses that
# space. To keep the feature instead, X=38 makes the 2x2 grid fit exactly.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
