name: 'Build Chocofi'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      # Asymmetric on purpose. LEFT uses ZMK's stock nice_view; RIGHT uses
      # zmk-nice-oled for the spaceman. Putting zmk-nice-oled on the CENTRAL
      # half causes Bluetooth typing lag -- see config/corne.conf.
      shield: '["corne_left nice_view_adapter nice_view","corne_right nice_view_adapter nice_epaper"]'
      modules: '["mctechnology17/zmk-nice-oled/main"]'
      # ZMK is pinned rather than tracking main. ZMK main has migrated to
      # Zephyr's Hardware Model v2, which renamed the board: nice_nano_v2 no
      # longer exists and is now nice_nano with "2.0.0" as a board revision.
      # Miryoku's own build examples still use nice_nano_v2, and zmk-nice-oled
      # pins ZMK v0.3.0 in its README, so v0.3.0 is the revision where all
      # three agree.
      branches: '["zmkfirmware/zmk/v0.3.0"]'
